name: safeher_ai
description: SafeHer AI — personal safety companion app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & navigation
  provider: ^6.1.2
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^3.0.1

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Location & maps
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  permission_handler: ^11.3.1

  # Device capabilities used for SOS evidence capture
  camera: ^0.12.0+2
  record: ^7.1.1
  battery_plus: ^6.0.2
  vibration: ^2.0.1

  # Utilities
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  uuid: ^4.4.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon/app_icon.png"